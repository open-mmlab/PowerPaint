pretrained_model_name_or_path: "/workdir/radish/hachi/checkpoints/stable-diffusion-inpainting"
ppt1_model_path: "/workdir/radish/hachi/checkpoints/ppt-v1"
#tracker_project_name: "ppt1_finetune_bs64"
#report_to: "wandb"
output_dir: "/workdir/radish/hachi/New_ouput_3"

# learnable task prompts
task_prompt:
  object_inpainting:
    placeholder_tokens: "P_obj"
    initializer_token: "a"
    num_vectors_per_token: 10

  context_inpainting:
    placeholder_tokens: "P_ctxt"
    initializer_token: "a"
    num_vectors_per_token: 10

  shape_inpainting:
    placeholder_tokens: "P_shape"
    initializer_token: "a"
    num_vectors_per_token: 10

# training data
train_data:
  resolution: 512
  datasets:
    name: "FSC147"
    data_path: "/workdir/radish/hachi/OBJ_INS/phase2_V2/train"

# training hyper-parameters
num_train_epochs: 20
lr_warmup_steps: 200
learning_rate: 1e-5
max_train_steps: 8e3            # max training steps
train_batch_size: 64              # batch size per GPU
dataloader_num_workers: 8

gradient_checkpointing: true

checkpointing_steps: 2e2
validation_steps: 2e2
checkpoints_total_limit: 10
# resume_from_checkpoint: "latest"


# validation data
validation_data:
  data_root: "/home/hachi/obj-ins/PowerPaint/validation/"
  cases:
    - image: "test/2_b1/ground_truth.png" # cần resize
      mask: "test/2_b1/mask.png" # cần bbox mask
      name: 2_b1
      prompt:
        - task: "indomain_inpainting" 
          prompt: ""
          negative_prompt: ""
          promptA: ${task_prompt.context_inpainting.placeholder_tokens} A seashell
          promptB: ${task_prompt.context_inpainting.placeholder_tokens} A seashell
          tradeoff: 1.0
          negative_promptA: ""
          negative_promptB: ""
        - task: "indomain_inpainting" 
          prompt: ""
          negative_prompt: ""
          promptA: P_obj A seashell
          promptB: P_obj A seashell
          tradeoff: 1.0
          negative_promptA: ""
          negative_promptB: ""
        
    - image: "val/560_b3/ground_truth.png" # cần resize
      mask: "val/560_b3/mask.png" # cần bbox mask
      name: 560_b3
      prompt:
        - task: "indomain_inpainting" 
          prompt: ""
          negative_prompt: ""
          promptA: ${task_prompt.context_inpainting.placeholder_tokens} A flamingo
          promptB: ${task_prompt.context_inpainting.placeholder_tokens} A flamingo
          tradeoff: 1.0
          negative_promptA: ""
          negative_promptB: ""
        - task: "indomain_inpainting" 
          prompt: ""
          negative_prompt: ""
          promptA: P_obj A flamingo
          promptB: P_obj A flamingo
          tradeoff: 1.0
          negative_promptA: ""
          negative_promptB: ""
